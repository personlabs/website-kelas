        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #161b22;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h2 {
            text-align: center;
            color: #58a6ff;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        input, select, textarea {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #58a6ff;
        }
        textarea {
            resize: vertical;
            height: 120px;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .checkbox-group input {
            width: auto;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #2ea043;
        }
        .thank-you {
            display: none;
            text-align: center;
            padding: 40px 0;
        }
        .thank-you i {
            font-size: 50px;
            color: #3fb950;
            margin-bottom: 15px;
        }
        .alert-box {
            background: rgba(88, 166, 255, 0.15);
            border: 1px solid #58a6ff;
            padding: 12px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 20px;
            color: #58a6ff;
        }
    </style>

<style id="v8-final-layout">
/* V8 FINAL LAYOUT FIX — audio, top button, album cover sizing */
:root{--v8-safe:env(safe-area-inset-bottom,0px);--v8-nav:72px;--v8-audio:74px}

/* Never show the legacy scroll-to-top control; V8 uses exactly one button. */
#scrollTopBtn,.scroll-top-btn{display:none!important}

/* Exactly one fixed Back-to-top button, independent from the right drawer. */
#uiTop.ui-top-fixed{
  position:fixed!important;
  right:16px!important;
  left:auto!important;
  bottom:calc(var(--v8-nav) + 16px + var(--v8-safe))!important;
  width:50px!important;height:50px!important;
  display:grid!important;place-items:center!important;
  border-radius:50%!important;
  z-index:10070!important;
  opacity:1!important;visibility:visible!important;
  pointer-events:auto!important;
}

/* Right drawer: closed means ONLY the 3-dot tab is visible. */
.ui-tools{
  position:fixed!important;top:50%!important;right:-270px!important;left:auto!important;
  width:240px!important;max-width:240px!important;
  transform:translateY(-50%)!important;
  z-index:10080!important;
  overflow:visible!important;
  transition:right .28s cubic-bezier(.2,.8,.2,1)!important;
}
.ui-tools.is-open{right:0!important}
.v7-tools-trigger{
  position:fixed!important;right:0!important;top:50%!important;
  transform:translateY(-50%)!important;
  width:28px!important;height:56px!important;
  padding:0!important;margin:0!important;
  border:1px solid rgba(129,140,248,.34)!important;border-right:0!important;
  border-radius:14px 0 0 14px!important;
  display:grid!important;place-items:center!important;
  z-index:10090!important;
  background:rgba(10,15,28,.98)!important;color:#a5b4fc!important;
}
.v7-tools-trigger.is-open{right:240px!important}

/* AUDIO: closed state is completely below the viewport. No player pixels may peek out. */
.audio-player.audio-dock{
  position:fixed!important;left:50%!important;right:auto!important;
  bottom:calc(var(--v8-nav) + 6px + var(--v8-safe))!important;
  width:min(720px,calc(100vw - 20px))!important;
  height:var(--v8-audio)!important;min-height:var(--v8-audio)!important;
  box-sizing:border-box!important;

  transition:transform .30s cubic-bezier(.2,.8,.2,1),opacity .18s ease,visibility 0s linear .30s!important;
}

  transform:translate(-50%,0)!important;
  visibility:visible!important;
  pointer-events:auto!important;

<body>

<div class="container">
    <!-- Form Container -->
    <div id="formContainer">
        <h2>Kotak Saran & Aspirasi Kelas</h2>
        
        <div class="alert-box">
            <i class="fa-solid fa-lightbulb"></i> Sampaikan ide, masukan, atau aspirasi membangun untuk kemajuan dan kenyamanan kelas kita bersama.
        </div>

        <!-- Tambahkan action dan method agar Formspree mengenali endpoint -->
        <form id="complaintForm" action="https://formspree.io/f/xqpeqenv" method="POST">
            <div class="form-group">
                <label for="reporterName">Nama Pengirim (Opsional)</label>
<input type="text" id="reporterName" name="Nama_Pengirim" autocomplete="name" maxlength="60" placeholder="Nama kamu (boleh dikosongkan)">
<span class="form-hint">Jika mode anonim aktif, nama tidak dikirim.</span>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="isAnonymous" name="Anonim" checked>
                <label for="isAnonymous" style="margin-bottom:0; cursor:pointer;">Kirim sebagai Anonim (Sembunyikan Nama)</label>
            </div>

            <div class="form-group">
                <label>Kategori Saran / Aspirasi *</label>
                <select id="category" name="Kategori" required>
                    <option value="">-- Pilih Kategori --</option>
                    <option value="Kebersihan & Kenyamanan Kelas">Kebersihan & Kenyamanan Kelas</option>
                    <option value="Fasilitas & Inventaris Kelas">Fasilitas & Inventaris Kelas</option>
                    <option value="Kegiatan / Acara Kelas">Kegiatan / Acara Kelas</option>
                    <option value="Pembelajaran & Akademik">Pembelajaran & Akademik</option>
                    <option value="Lainnya">Lainnya</option>
                </select>
            </div>

            <div class="form-group">
                <label>Isi Saran / Aspirasi *</label>
                <textarea id="fullMessage" name="Isi_Saran" required minlength="10" maxlength="1000" placeholder="Tuliskan ide, kritik membangun, atau saran Anda di sini..."></textarea>
<div class="char-count"><span id="charCount">0</span>/1000</div>
            </div>

            <button type="submit" id="submitBtn">
                <i class="fa-solid fa-paper-plane"></i> Kirim Saran
            </button>
        </form>
    </div>

    <!-- Thank You Container -->
    <div id="thankYouContainer" class="thank-you">
        <i class="fa-solid fa-circle-check"></i>
        <h3>Saran Berhasil Terkirim!</h3>
        <p>Terima kasih, masukan dan aspirasi Anda telah diterima untuk kemajuan kelas kita bersama.</p>
        <button type="button" id="newSuggestionBtn" style="margin-top: 20px; width: auto; padding: 10px 20px;">Kirim Saran Lain</button>
    </div>
</div>

<script>
    const form = document.getElementById('complaintForm');
    const formContainer = document.getElementById('formContainer');
    const thankYouContainer = document.getElementById('thankYouContainer');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        let reporterNameInput = document.getElementById('reporterName').value.trim();
        const isAnonymous = document.getElementById('isAnonymous').checked;
        
        let reporterName = (isAnonymous || reporterNameInput === '') ? 'Anonim (Dirahasiakan)' : reporterNameInput;
        let category = document.getElementById('category').value;
        let fullMessage = document.getElementById('fullMessage').value;
        
        let now = new Date();
        let timeSent = now.toLocaleString('id-ID', { 
            dateStyle: 'full', 
            timeStyle: 'medium' 
        });

        // Ubah tombol jadi status loading
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengirim...';

        // Gunakan FormData untuk mengirim data secara stabil ke Formspree
        const formData = new FormData();
        formData.append('Nama_Pengirim', reporterName);
        formData.append('Kategori', category);
        formData.append('Isi_Saran', fullMessage);
        formData.append('Tanggal_Kirim', timeSent);

        fetch(form.action, {
            method: 'POST',
            body: formData,
            headers: {
                'Accept': 'application/json'
            }
        })
        .then(response => {
            if (response.ok) {
                formContainer.style.display = 'none';
                thankYouContainer.style.display = 'block';
                form.reset();
            } else {
                return response.json().then(data => {
                    if (data.errors) {
                        alert('Gagal: ' + data.errors.map(err => err.message).join(', '));
                    } else {
                        alert('Gagal mengirim saran, silakan coba lagi.');
                    }
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Kirim Saran';
                });
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('Terjadi kesalahan jaringan atau koneksi.');
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Kirim Saran';
        });
    });
</script>

<script>
(function () {
  const nameInput = document.getElementById('reporterName');
  const anonymousInput = document.getElementById('isAnonymous');
  const messageInput = document.getElementById('fullMessage');
  const count = document.getElementById('charCount');
  const newSuggestionButton = document.getElementById('newSuggestionBtn');

  function syncAnonymousState() {
    if (!nameInput || !anonymousInput) return;
    nameInput.disabled = anonymousInput.checked;
    if (anonymousInput.checked) nameInput.value = '';
  }

  if (anonymousInput) anonymousInput.addEventListener('change', syncAnonymousState);
  if (messageInput && count) {
    messageInput.addEventListener('input', function () { count.textContent = String(messageInput.value.length); });
  }
  if (newSuggestionButton) {
    newSuggestionButton.addEventListener('click', function () { window.location.reload(); });
  }
  syncAnonymousState();
})();
</script>

<script>
(function(){
  'use strict';
  const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
  const body=document.body;

  // Progress + tools
  const progress=document.createElement('div'); progress.className='ui-progress'; progress.setAttribute('aria-hidden','true');
  document.documentElement.appendChild(progress);
  const tools=document.createElement('div'); tools.className='ui-tools';
  tools.innerHTML=`
    <button class="ui-tool" id="uiTheme" type="button" aria-label="Ganti tema" title="Ganti tema"><i class="fa-solid fa-moon"></i></button>
    <button class="ui-tool" id="uiShare" type="button" aria-label="Bagikan halaman" title="Bagikan"><i class="fa-solid fa-share-nodes"></i></button>
    <button class="ui-tool" id="uiTop" type="button" aria-label="Kembali ke atas" title="Kembali ke atas" hidden><i class="fa-solid fa-arrow-up"></i></button>`;
  body.appendChild(tools);
  const toast=document.createElement('div'); toast.className='ui-toast'; toast.setAttribute('role','status'); body.appendChild(toast);
  let toastTimer;
  function notify(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2200)}

  const saved=localStorage.getItem('kelas-theme');
  if(saved==='light') body.classList.add('ui-light');
  const themeBtn=$('#uiTheme');
  function updateThemeIcon(){themeBtn.innerHTML=body.classList.contains('ui-light')?'<i class="fa-solid fa-sun"></i>':'<i class="fa-solid fa-moon"></i>'}
  updateThemeIcon();
  themeBtn.onclick=()=>{body.classList.toggle('ui-light');localStorage.setItem('kelas-theme',body.classList.contains('ui-light')?'light':'dark');updateThemeIcon();notify(body.classList.contains('ui-light')?'Mode terang aktif':'Mode gelap aktif')};

  $('#uiShare').onclick=async()=>{
    const data={title:document.title,text:document.title,url:location.href};
    try{if(navigator.share){await navigator.share(data)}else{await navigator.clipboard.writeText(location.href);notify('Link halaman berhasil disalin')}}
    catch(e){}
  };
  const topBtn=$('#uiTop');
  function onScroll(){
    const h=document.documentElement.scrollHeight-innerHeight;
    progress.style.width=(h>0?Math.min(100,scrollY/h*100):0)+'%';
    topBtn.hidden=scrollY<450;
  }
  addEventListener('scroll',onScroll,{passive:true}); onScroll();
  topBtn.onclick=()=>scrollTo({top:0,behavior:'smooth'});

  // Semua gambar: lazy loading untuk gambar non-hero + decoding async
  $$('img').forEach((img,i)=>{if(i>0 && !img.loading) img.loading='lazy';img.decoding='async'});

  // Gallery search/filter untuk halaman album
  const photos=$$('.photo-item');
  if(photos.length){
    const container=$('.container')||photos[0].parentElement;
    const toolbar=document.createElement('div'); toolbar.className='ui-toolbar';
    toolbar.innerHTML='<input class="ui-search" type="search" placeholder="Cari momen atau keterangan foto…" aria-label="Cari foto"><span class="ui-count"></span>';
    container.insertBefore(toolbar,photos[0].parentElement);
    const search=$('.ui-search',toolbar), count=$('.ui-count',toolbar);
    const empty=document.createElement('div'); empty.className='ui-empty'; empty.textContent='Tidak ada foto yang cocok dengan pencarian.'; container.appendChild(empty);
    function filter(){
      const q=search.value.trim().toLowerCase();let shown=0;
      photos.forEach(p=>{const text=(p.innerText+' '+$$('img',p).map(i=>i.alt).join(' ')).toLowerCase();const ok=!q||text.includes(q);p.classList.toggle('ui-hidden',!ok);if(ok)shown++});
      count.textContent=shown+' foto';empty.classList.toggle('show',shown===0);
    }
    search.addEventListener('input',filter);filter();
  }

  // Pencarian anggota di halaman utama
  const students=$$('.student-list-item');
  if(students.length){
    const list=students[0].parentElement;
    const toolbar=document.createElement('div'); toolbar.className='ui-toolbar';
    toolbar.innerHTML='<input class="ui-search" type="search" placeholder="Cari nama anggota kelas…" aria-label="Cari anggota kelas"><span class="ui-count"></span>';
    list.parentElement.insertBefore(toolbar,list);
    const search=$('.ui-search',toolbar),count=$('.ui-count',toolbar);
    const empty=document.createElement('div');empty.className='ui-empty';empty.textContent='Nama anggota tidak ditemukan.';list.parentElement.appendChild(empty);
    function filter(){const q=search.value.trim().toLowerCase();let shown=0;students.forEach(p=>{const ok=!q||p.innerText.toLowerCase().includes(q);p.classList.toggle('ui-hidden',!ok);if(ok)shown++});count.textContent=shown+' anggota';empty.classList.toggle('show',shown===0)}
    search.addEventListener('input',filter);filter();
  }

  // Keyboard shortcut /: fokus pencarian
  addEventListener('keydown',e=>{if(e.key==='/' && !/input|textarea|select/i.test(document.activeElement.tagName)){const s=$('.ui-search');if(s){e.preventDefault();s.focus()}}});
})();
</script>










<script id="v7-layout-js">
(function(){
'use strict';
const tools=document.querySelector('.ui-tools');
const audio=document.querySelector('.audio-player');
const body=document.body;

/* Right controls: only a fixed three-dot tab remains visible while closed. */
if(tools){
  const oldHandle=tools.querySelector('.ui-drawer-handle');
  if(oldHandle) oldHandle.remove();
  const trigger=document.createElement('button');
  trigger.type='button';
  trigger.className='v7-tools-trigger';
  trigger.setAttribute('aria-label','Buka menu tampilan');
  trigger.setAttribute('aria-expanded','false');
  trigger.innerHTML='<i class="fa-solid fa-ellipsis-vertical" aria-hidden="true"></i>';
  body.appendChild(trigger);
  let open=false,downX=0,moved=false;
  function setOpen(v){open=!!v;tools.classList.toggle('is-open',open);trigger.classList.toggle('is-open',open);trigger.setAttribute('aria-expanded',String(open));trigger.setAttribute('aria-label',open?'Tutup menu tampilan':'Buka menu tampilan');trigger.innerHTML=open?'<i class="fa-solid fa-xmark" aria-hidden="true"></i>':'<i class="fa-solid fa-ellipsis-vertical" aria-hidden="true"></i>';}
  trigger.addEventListener('click',()=>{if(!moved)setOpen(!open);moved=false;});
  trigger.addEventListener('pointerdown',e=>{downX=e.clientX;moved=false;trigger.setPointerCapture?.(e.pointerId);});
  trigger.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-downX)>8)moved=true;});
  trigger.addEventListener('pointerup',e=>{const dx=e.clientX-downX;if(Math.abs(dx)>20)setOpen(dx<0);moved=false;});
  addEventListener('scroll',()=>setOpen(false),{passive:true});
}

/* Scroll-to-top stays independent and always available. */
const top=document.getElementById('uiTop');
if(top){top.removeAttribute('hidden');top.className='ui-top-fixed';if(top.parentElement!==body)body.appendChild(top);addEventListener('scroll',()=>{top.hidden=false;},{passive:true});}

/* Audio: the panel itself is never used as the drag handle. A separate fixed tab is used. */
if(audio){
  audio.classList.add('audio-dock');
  const old=audio.querySelector('.audio-toggle');
  if(old) old.remove();
  const trigger=document.createElement('button');
  trigger.type='button';trigger.className='v7-audio-trigger';
  trigger.setAttribute('aria-label','Buka pemutar audio');trigger.setAttribute('aria-expanded','false');
  trigger.innerHTML='<i class="fa-solid fa-chevron-up" aria-hidden="true"></i>';
  body.appendChild(trigger);
  let open=false,downY=0,moved=false;
  function setOpen(v){open=!!v;audio.classList.toggle('is-open',open);trigger.classList.toggle('is-open',open);trigger.setAttribute('aria-expanded',String(open));trigger.setAttribute('aria-label',open?'Tutup pemutar audio':'Buka pemutar audio');trigger.innerHTML=open?'<i class="fa-solid fa-chevron-down" aria-hidden="true"></i>':'<i class="fa-solid fa-chevron-up" aria-hidden="true"></i>';}
  trigger.addEventListener('click',()=>{if(!moved)setOpen(!open);moved=false;});
  trigger.addEventListener('pointerdown',e=>{downY=e.clientY;moved=false;trigger.setPointerCapture?.(e.pointerId);});
  trigger.addEventListener('pointermove',e=>{if(Math.abs(e.clientY-downY)>8)moved=true;});
  trigger.addEventListener('pointerup',e=>{const dy=e.clientY-downY;if(Math.abs(dy)>20)setOpen(dy<0);moved=false;});
  addEventListener('scroll',()=>setOpen(false),{passive:true});
  setOpen(false);
}
})();
</script>

<script id="v8-final-layout-js">
(function(){
  'use strict';
  const body=document.body;

  /* Remove the old floating top button entirely, leaving V8's #uiTop as the only one. */
  const legacyTop=document.getElementById('scrollTopBtn');
  if(legacyTop) legacyTop.remove();
  const top=document.getElementById('uiTop');
  if(top){
    top.hidden=false;
    top.className='ui-top-fixed';
    if(top.parentElement!==body) body.appendChild(top);
    top.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
  }

  /* Right controls: closed state exposes only the 3-dot trigger. */
  const tools=document.querySelector('.ui-tools');
  if(tools){
    const oldHandle=tools.querySelector('.ui-drawer-handle');
    if(oldHandle) oldHandle.remove();
    const oldTrigger=document.querySelector('.v7-tools-trigger');
    if(oldTrigger) oldTrigger.remove();
    const trigger=document.createElement('button');
    trigger.type='button';
    trigger.className='v7-tools-trigger';
    trigger.setAttribute('aria-label','Buka menu tampilan');
    trigger.setAttribute('aria-expanded','false');
    trigger.innerHTML='<i class="fa-solid fa-ellipsis-vertical" aria-hidden="true"></i>';
    body.appendChild(trigger);
    let open=false,downX=0,moved=false;
    function setOpen(v){
      open=!!v;
      tools.classList.toggle('is-open',open);
      trigger.classList.toggle('is-open',open);
      trigger.setAttribute('aria-expanded',String(open));
      trigger.innerHTML=open?'<i class="fa-solid fa-xmark" aria-hidden="true"></i>':'<i class="fa-solid fa-ellipsis-vertical" aria-hidden="true"></i>';
    }
    trigger.addEventListener('click',()=>{if(!moved)setOpen(!open);moved=false});
    trigger.addEventListener('pointerdown',e=>{downX=e.clientX;moved=false;trigger.setPointerCapture?.(e.pointerId)});
    trigger.addEventListener('pointermove',e=>{if(Math.abs(e.clientX-downX)>8)moved=true});
    trigger.addEventListener('pointerup',e=>{const dx=e.clientX-downX;if(Math.abs(dx)>20)setOpen(dx<0);moved=false});
    window.addEventListener('scroll',()=>setOpen(false),{passive:true});
    setOpen(false);
  }

  /* Audio: separate trigger; closed player is fully invisible and non-interactive. */
  const audio=document.querySelector('.audio-player');
  if(audio){
    audio.classList.add('audio-dock');
    audio.classList.remove('is-open');
    const old=audio.querySelector('.audio-toggle');
    if(old) old.remove();
    const oldTriggers=document.querySelectorAll('.v7-audio-trigger');
    oldTriggers.forEach(el=>el.remove());
    const trigger=document.createElement('button');
    trigger.type='button';
    trigger.className='v7-audio-trigger';
    trigger.setAttribute('aria-label','Buka pemutar audio');
    trigger.setAttribute('aria-expanded','false');
    trigger.innerHTML='<i class="fa-solid fa-chevron-up" aria-hidden="true"></i>';
    body.appendChild(trigger);
    let open=false,downY=0,moved=false;
    function setOpen(v){
      open=!!v;
      audio.classList.toggle('is-open',open);
      trigger.classList.toggle('is-open',open);
      trigger.setAttribute('aria-expanded',String(open));
      trigger.innerHTML=open?'<i class="fa-solid fa-chevron-down" aria-hidden="true"></i>':'<i class="fa-solid fa-chevron-up" aria-hidden="true"></i>';
    }
    trigger.addEventListener('click',()=>{if(!moved)setOpen(!open);moved=false});
    trigger.addEventListener('pointerdown',e=>{downY=e.clientY;moved=false;trigger.setPointerCapture?.(e.pointerId)});
    trigger.addEventListener('pointermove',e=>{if(Math.abs(e.clientY-downY)>8)moved=true});
    trigger.addEventListener('pointerup',e=>{const dy=e.clientY-downY;if(Math.abs(dy)>18)setOpen(dy<0);moved=false});
    window.addEventListener('scroll',()=>setOpen(false),{passive:true});
    setOpen(false);
  }
})();
</script>
